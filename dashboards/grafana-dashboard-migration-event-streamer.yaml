              "editorMode": "code",
              "expr": "sum(up{namespace=\"$namespace\",service=\"migration-event-streamer-metrics\",pod=~\"${pod:regex}\"}) / count(up{namespace=\"$namespace\",service=\"migration-event-streamer-metrics\",pod=~\"${pod:regex}\"})",
